<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-app">
    <h1>Weather App</h1>

    <div class="search-box">
      <input id="cityInput" type="text" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <p id="message">Search a city to see the weather.</p>

    <section id="weatherInfo" class="weather-info" hidden>
      <h2 id="cityName"></h2>
      <p id="condition"></p>
      <p class="temperature"><span id="temperature"></span>°C</p>
      <p>Humidity: <span id="humidity"></span>%</p>
      <p>Wind speed: <span id="windSpeed"></span> km/h</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
